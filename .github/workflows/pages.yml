name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.1'
      - uses: pnpm/action-setup@v6
        with:
          version: '11.14.0'
          run_install: false
      - name: Install MoonBit
        run: |
          export MOONBIT_INSTALL_VERSION="$(cat .moon-version)"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all
      - uses: actions/configure-pages@v5
      - name: Install locked dependencies
        run: pnpm --dir playground install --frozen-lockfile
      - name: Verify engine and build showcase
        run: |
          moon test --target wasm
          moon test --target js
          pnpm --dir playground run check
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
